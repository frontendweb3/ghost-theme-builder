name: Skill Publish
 
on:
  pull_request:
  workflow_dispatch:
 
jobs:
  dry-run:
    if: github.event_name == 'pull_request'
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@v1
    with:
      owner: frontendweb
      dry_run: true
 
  publish:
    permissions:
      contents: read
      id-token: write 
    if: github.event_name == 'workflow_dispatch'
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@v1
    with:
      owner: frontendweb
      dry_run: false
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}

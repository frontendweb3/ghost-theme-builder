# .github/workflows/sync-ghost-docs.yml
name: Sync Ghost Theme Docs

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@26
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Ghost docs from upstream
        run: pnpm run sync:ghost-docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REPO: TryGhost/Docs
          UPSTREAM_PATH: themes
          TARGET_DIR: docs

      - name: Commit changes, update package.json, and trigger publish
        run: |
          if [ -z "$(git status --porcelain docs)" ]; then
            echo "No changes in docs to commit"
            exit 0
          fi
          pnpm version patch --no-git-tag-version --no-git-checks
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs package.json
          git commit -m "chore: sync Ghost theme docs and bump version"
          git push origin main
          gh workflow run publish.yml --ref main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# .github/workflows/sync-ghost-docs.yml
name: Sync Ghost Theme Docs

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Sync Ghost docs from upstream
        run: node scripts/sync-ghost-docs.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REPO: TryGhost/Docs
          UPSTREAM_PATH: themes
          TARGET_DIR: docs/upstream/themes

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/upstream/themes
          git commit -m "chore: sync Ghost theme docs"
          git push origin main